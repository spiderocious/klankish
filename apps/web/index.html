<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klankish</title>
    <meta
      name="description"
      content="Scheduled, conditional task automation with a complete record of every run."
    />
    <script>
      /*
       * Theme, applied BEFORE first paint.
       *
       * Inline and synchronous on purpose: doing this in React would mean the page renders once
       * in light, then repaints in dark — the flash every dark-mode user notices.
       *
       * Light is the stated default, so `prefers-color-scheme` is consulted ONLY when the viewer
       * has never chosen. localStorage is wrapped because it throws outright in some private
       * browsing modes, and a theme preference must never be able to break the app.
       */
      (function () {
        try {
          var stored = localStorage.getItem('klankish-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
            return;
          }
        } catch (e) {
          /* storage unavailable — fall through to the default */
        }
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
